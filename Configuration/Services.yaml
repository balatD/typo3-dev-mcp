services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  BalatD\DevMcp\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Mcp/SdkToolHandler.php'
      # depends on an optional package — registered from Services.php when present
      - '../Classes/Mcp/Tool/ContentBlocksTool.php'

  BalatD\DevMcp\Mcp\ToolRegistry:
    arguments:
      $tools: !tagged_iterator devmcp.tool

  BalatD\DevMcp\Command\ServeCommand:
    tags:
      - name: console.command
        command: 'devmcp:serve'
        description: 'Start the typo3-dev-mcp MCP server on stdio (for AI assistants, not humans)'
        schedulable: false

  BalatD\DevMcp\Command\InstallCommand:
    tags:
      - name: console.command
        command: 'devmcp:install'
        description: 'Register the typo3-dev-mcp MCP server with AI assistants and install AI guidelines'
        schedulable: false
