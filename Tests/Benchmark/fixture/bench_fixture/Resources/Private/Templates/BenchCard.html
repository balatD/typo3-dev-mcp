<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Main">
    <div class="bench-card bench-card--level-{data.tx_benchfixture_level}">
        <f:if condition="{data.header}">
            <h2 class="bench-card__header">{data.header}</h2>
        </f:if>
        <f:render partial="BenchTeaser" arguments="{teaser: data.tx_benchfixture_teaser}" />
        <div class="bench-card__body">
            <f:format.html>{data.bodytext}</f:format.html>
        </div>
    </div>
</f:section>

</html>
