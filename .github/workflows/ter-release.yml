name: TER release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to the TER
    runs-on: ubuntu-latest
    # Pre-release tags (v1.1.0-beta.1) carry a hyphen and must never reach the
    # TER, which has no concept of stability suffixes.
    if: "!contains(github.ref_name, '-')"
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Resolve the version from the tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The version is committed in two files — ext_emconf.php for the TER and
      # extra.typo3/cms.version in composer.json so TYPO3 v14 does not deprecate
      # the former. `tailor set-version` writes both; when either drifts from the
      # tag the TER silently ships the wrong number, so fail here instead.
      - name: Check the committed versions match the tag
        run: |
          tag="${{ steps.version.outputs.number }}"
          emconf=$(grep -oE "'version' => '[^']+'" ext_emconf.php | head -1 | sed "s/.*'version' => '\(.*\)'/\1/")
          composer_version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["extra"]["typo3/cms"]["version"] ?? "";')
          for pair in "ext_emconf.php:$emconf" "composer.json:$composer_version"; do
            file="${pair%%:*}"; found="${pair#*:}"
            if [ "$found" != "$tag" ]; then
              echo "::error::$file says '$found' but the tag says '$tag'."
              echo "Run 'vendor/bin/tailor set-version $tag', commit, and re-tag."
              exit 1
            fi
          done
          echo "ext_emconf.php and composer.json both agree on $tag."

      # tailor only zips and uploads the extension folder, so the project's own
      # dependencies are not installed here — a global install is enough.
      - run: composer global require typo3/tailor "^2.0" --no-progress

      - name: Publish
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --comment "See CHANGELOG.md for the release notes." \
            "${{ steps.version.outputs.number }}" dev_mcp
