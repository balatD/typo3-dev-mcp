name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-progress
      - run: composer stan

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', typo3: '^13.4' }
          - { php: '8.3', typo3: '^13.4' }
          - { php: '8.4', typo3: '^13.4' }
          - { php: '8.3', typo3: '^14.0' }
          - { php: '8.4', typo3: '^14.0' }
    name: "Unit (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - run: composer require typo3/cms-core:"${{ matrix.typo3 }}" --no-update
      - run: composer update --no-progress
      - run: composer test:unit
